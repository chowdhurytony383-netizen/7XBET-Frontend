<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 260" role="img" aria-labelledby="title desc">
  <title id="title">7XBET Logo</title>
  <desc id="desc">Premium 7XBET wordmark logo in cyan, blue, green and silver.</desc>
  <defs>
    <linearGradient id="sevenGradient" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#37f8ff"/>
      <stop offset="0.52" stop-color="#08c9d6"/>
      <stop offset="1" stop-color="#21e17a"/>
    </linearGradient>
    <linearGradient id="sevenDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19efb6"/>
      <stop offset="1" stop-color="#006b44"/>
    </linearGradient>
    <linearGradient id="xGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47f8ff"/>
      <stop offset="0.45" stop-color="#0aa7ed"/>
      <stop offset="1" stop-color="#0457d6"/>
    </linearGradient>
    <linearGradient id="silverGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#9aa9b7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-45%" width="145%" height="190%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.00 0 0 0 0 0.70 0 0 0 0 1.00 0 0 0 .32 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000b17" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#20dfff" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <polygon points="62,38 338,38 308,75 185,75 73,222 118,74 42,74" fill="url(#sevenGradient)"/>
    <polygon points="185,92 220,132 79,236 131,142" fill="url(#sevenDark)" opacity="0.95"/>
    <polygon points="54,38 338,38 321,52 72,52" fill="#99ffff" opacity="0.42"/>
  </g>

  <g filter="url(#shadow)">
    <polygon points="348,62 435,62 501,150 444,219 366,219 429,142" fill="url(#xGradient)"/>
    <polygon points="513,62 599,62 500,219 421,219" fill="url(#xGradient)"/>
    <polygon points="445,61 484,61 506,92 474,127 445,92" fill="#50e9ff" opacity="0.9"/>
    <polygon points="358,70 430,70 453,102 378,102" fill="#7effff" opacity="0.22"/>
  </g>

  <text x="600" y="188" font-family="Arial Black, Montserrat, Poppins, Inter, Arial, sans-serif" font-size="146" font-weight="900" font-style="italic" letter-spacing="-12" fill="url(#silverGradient)" stroke="#6d7c8b" stroke-width="2" filter="url(#shadow)">BET</text>
</svg>
