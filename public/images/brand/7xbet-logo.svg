<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img" aria-label="7XBET">
  <defs>
    <linearGradient id="sevenGradient" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#7dfffb"/>
      <stop offset="42%" stop-color="#06c9ff"/>
      <stop offset="100%" stop-color="#22e277"/>
    </linearGradient>
    <linearGradient id="xbetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf8ff"/>
      <stop offset="38%" stop-color="#26d6ff"/>
      <stop offset="100%" stop-color="#006fe8"/>
    </linearGradient>
    <linearGradient id="betGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d9e8f6"/>
      <stop offset="100%" stop-color="#94a7bb"/>
    </linearGradient>
    <filter id="logoGlow" x="-25%" y="-35%" width="150%" height="170%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.05  0 0 0 0 0.75  0 0 0 0 1  0 0 0 .7 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <text x="18" y="139"
      font-family="Arial Black, Impact, system-ui, sans-serif"
      font-size="145"
      font-weight="900"
      font-style="italic"
      letter-spacing="-18"
      fill="url(#sevenGradient)"
      filter="url(#logoGlow)">7</text>

    <text x="153" y="140"
      font-family="Arial Black, Impact, system-ui, sans-serif"
      font-size="132"
      font-weight="900"
      font-style="italic"
      letter-spacing="-10"
      fill="url(#xbetGradient)"
      filter="url(#logoGlow)">X</text>

    <text x="278" y="140"
      font-family="Arial Black, Impact, system-ui, sans-serif"
      font-size="128"
      font-weight="900"
      font-style="italic"
      letter-spacing="-8"
      fill="url(#betGradient)">BET</text>

    <path d="M54 147 L143 62 L161 79 L70 162 Z" fill="#22e277" opacity=".88"/>
    <path d="M147 33 L224 137" stroke="#7dfbff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <path d="M295 37 H646" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".2"/>
  </g>
</svg>
